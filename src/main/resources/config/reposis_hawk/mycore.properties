# Project specific configuration for hawk.
# Only properties that differ from MyCoRe, MIR or reposis_common defaults are listed here.
# Empty values differ between test and production or are confidential and must be set via Ansible inventory.

##############################################################################
# Basic                                                                      #
##############################################################################
# Base URL, e.g. https://domain without trailing '/'
MCR.baseurl=

# Base URL for canonical links on metadata pages, e.g. https://domain/
MIR.CanonicalBaseURL=

MCR.NameOfProject=hawk
MIR.projectid.default=hawk

##############################################################################
# Email                                                                      #
##############################################################################
MCR.Mail.Server=

# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Editor mail addresses for messages, e.g. mail@domain0,mail@domain1
MCR.Mail.Address=

# Sender mail for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=

# Mail for Unpaywall requests
MIR.OADOI.Mail.Address=openaccess.bib@hawk.de

##############################################################################
# Access Control                                                             #
##############################################################################
# Disable access keys, MIR enables them for mods
MCR.ACL.AccessKey.Strategy.AllowedObjectTypes=

##############################################################################
# DOI                                                                        #
##############################################################################
MCR.DOI.Prefix=10.48547
MCR.DOI.HostingInstitution=HAWK Hochschule f\u00FCr angewandte Wissenschaft und Kunst

# Service is disabled until Datacite credentials are configured
#MCR.PI.Service.Datacite=org.mycore.pi.doi.MCRDOIService
MCR.PI.Service.Datacite.Transformer=datacite
MCR.PI.Service.Datacite.RegistrationPredicate=org.mycore.pi.condition.MCRPIPublishedPredicate
MCR.PI.Service.Datacite.RegisterBaseURL=%MCR.baseurl%
MCR.PI.Service.Datacite.Username=
MCR.PI.Service.Datacite.Password=
MCR.PI.Service.Datacite.Generator=DateDOI
MCR.PI.Service.Datacite.MetadataService=MODSDOI

# DOIs like 10.48547/202401-001
MCR.PI.Generator.DateDOI=org.mycore.pi.MCRGenericPIGenerator
MCR.PI.Generator.DateDOI.Type=doi
MCR.PI.Generator.DateDOI.GeneralPattern=%MCR.DOI.Prefix%/$ObjectDate-$Count
MCR.PI.Generator.DateDOI.DateFormat=yyyyMM
MCR.PI.Generator.DateDOI.CountPrecision=3

# Retry stalled registration jobs after one day
MCR.QueuedJob.MCRPIRegisterJobAction.TimeTillReset=1440

##############################################################################
# OAI                                                                        #
##############################################################################
MCR.OAIDataProvider.OAI2.RepositoryName=Publikationsserver der HAWK Bibliothek
MCR.OAIDataProvider.OAI2.AdminEmail=openaccess.bib@hawk.de
MCR.OAIDataProvider.OAI2.RecordSampleID=%MIR.projectid.default%_mods_00000321

# Keep URL format, changing it changes all OAI identifiers
MCR.OAIDataProvider.OAI2.RepositoryIdentifier=%MCR.baseurl%/

MCR.OAIDataProvider.OAI2.DescriptionURI.EPrints=webapp:oai/oai-eprints.xml
MCR.OAIDataProvider.OAI2.DescriptionURI.Rights=webapp:oai/oai-rights.xml

# Use DINI 2022 publication types for doc-type set, MIR still uses diniPublType
MCR.OAIDataProvider.OAI2.Sets.doc-type.Classification=diniPublType2022
MCR.OAIDataProvider.OAI2.Sets.doc-type.URI=xslStyle:classification2sets#xslt:classification:metadata:2:children:diniPublType2022

##############################################################################
# Editor                                                                     #
##############################################################################
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,\
  xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed

##############################################################################
# Frontend                                                                   #
##############################################################################
MIR.CustomLayout.JS=hawk.js

# Templates for static pages, e.g. the search form on the start page
MCR.URIResolver.xslIncludes.MyCoReWebPage=%MCR.URIResolver.xslIncludes.MyCoReWebPage%,hawk-templates.xsl

# Latest publications, see navigation
MCR.ContentTransformer.response-newest.Class=org.mycore.common.content.transformer.MCRXSLTransformer
MCR.ContentTransformer.response-newest.Stylesheet=%MCR.ContentTransformer.response-prepared.Stylesheet%,\
  xsl/response-newest.xsl,%MCR.LayoutTransformerFactory.Default.Stylesheets%

# ePuSta is disabled until the endpoint is configured
#MIR.ePuSta=show
MIR.ePuSta.providerURL=

##############################################################################
# User                                                                       #
##############################################################################
# Persist transient users (e.g. Shibboleth) after they create an object
#MCR.EventHandler.MCRObject.110.Class=org.mycore.user2.events.MCRPersistTransientUserEventHandler
